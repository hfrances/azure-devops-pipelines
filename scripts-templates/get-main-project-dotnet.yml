parameters:
  - name: displayName
    type: string
    default: 'Get main project from Solution'
  - name: solutionPattern
    type: string
    default: '$(BuildParameters.Solution)'
  - name: workingDirectory
    type: string
    default: ''

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $path = '${{ parameters.solutionPattern }}';

        # Find solution file (take only the first one if multiple match).
        $solutionFiles = @(Get-Item $path -ErrorAction SilentlyContinue);
        if ($solutionFiles.Count -eq 0) {
          write-error "Solution file not found: $path";
          exit 1;
        }
        if ($solutionFiles.Count -gt 1) {
          write-warning "$solutionFiles"
          write-error "Multiple solution files found matching '$path'.";
          exit 1
        }
        $solution = $solutionFiles[0];
        Write-Host "Solution found: $($solution.FullName)";
        Write-Host "##vso[task.setvariable variable=Solution.FullName]$($solution.FullName)";
      
        # Get first project in the solution. That is the main project.
        $projectPath = $null;
        $projectFile = $null;
        if ($solution.Extension -ieq '.sln') {
          $content = (Get-Content $solution);
          $pattern = '(?m)Project\(.*\)\s?=\s?"(?<ProjectName>.*)",\s?"(?<ProjectPath>.*)",\s?.*"';
          $projects = $content | Select-String $pattern -AllMatches;
          if ($projects -and $projects.Matches.Count -gt 0) {
            $projectPath = $projects.Matches[0].Groups['ProjectPath'].Value;
          }
        }
        elseif ($solution.Extension -ieq '.slnx') {
          [xml]$xml = Get-Content $solution -Raw;
          $projectNode = $xml.SelectSingleNode('//Project[@Path]');
          if ($projectNode -and $projectNode.Attributes['Path']) {
            $projectPath = $projectNode.Attributes['Path'].Value;
          }
        }
        elseif ($solution.Extension -imatch '^\.[^.]*proj$') {
          # A project file can be used directly instead of a solution.
          $projectFile = $solution.FullName;
        }
        else {
          write-error "Unsupported solution extension: $($solution.Extension).";
          exit 1;
        }

        if ([string]::IsNullOrWhiteSpace($projectFile)) {
          if ([string]::IsNullOrWhiteSpace($projectPath)) {
            write-error "No project found in solution '$($solution.FullName)'.";
            exit 1;
          }

          $projectFile = Join-Path $solution.Directory $projectPath;
        }

        $file = (Get-Item $projectFile -ErrorAction SilentlyContinue);

        if ($null -eq $file) {
          write-error "Project file not found: $projectFile";
          exit 1;
        }
        else {
          Write-Host "Main project found: $($file.FullName)";
          Write-Host "##vso[task.setvariable variable=MainProject.FullName]$($file.FullName)";
        }
        Write-Host ""

        # Find the nuget config file:
        $nugetConfigPath = Join-Path $solution.Directory 'nuget.config';
        if (-not [string]::IsNullOrWhiteSpace($env:ExternalFeed)) {
          Write-Host "External feed specified: $env:ExternalFeed";
          Write-Host "##vso[task.setvariable variable=Solution.NugetFeedToUse]select";
          Write-Host "##vso[task.setvariable variable=Solution.NugetConfig]";
        }
        elseif (Test-Path $nugetConfigPath) {
          $nugetConfig = (Get-Item $nugetConfigPath);
          Write-Host "Nuget config file found: $($nugetConfig.FullName)";
          Write-Host "##vso[task.setvariable variable=Solution.NugetFeedToUse]config";
          Write-Host "##vso[task.setvariable variable=Solution.NugetConfig]$($nugetConfig.FullName)";
        } 
        else {
          Write-Host "##vso[task.logissue type=warning]Nuget config file not found for pattern '$path'.";
          Write-Host "##vso[task.setvariable variable=Solution.NugetFeedToUse]select";
          Write-Host "##vso[task.setvariable variable=Solution.NugetConfig]";
        }
      workingDirectory: '${{ parameters.workingDirectory }}'
    displayName: ${{ parameters.displayName }}

# Documentation
# - Purpose:
#   Resolve the solution/project input, select its main project, and export the
#   solution and NuGet configuration variables used by preparation jobs.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Get main project from Solution`.
#   - parameter solutionPattern:
#     path or pattern resolving exactly one `.sln`, `.slnx`, or direct `.*proj`.
#   - parameter workingDirectory:
#     working directory for the PowerShell task.
# - Outputs:
#   - `Solution.FullName`
#   - `MainProject.FullName`
#   - `Solution.NugetFeedToUse`
#   - `Solution.NugetConfig`
# - Resolution rules:
#   For a solution, the first project entry is selected as the main project.
#   Multiple matching solution files and unsupported extensions fail the task.
