parameters:
  - name: displayName
    type: string
    default: 'Coverage: Check if there are test projects'
  - name: testResultsDirectory
    type: string
    default: '$(Build.SourcesDirectory)/TestResults'
  - name: condition
    type: string
    default: succeeded()

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $testResultsDirectory = "${{ parameters.testResultsDirectory }}";
        if (Test-Path $testResultsDirectory) {
          $files = Get-ChildItem $testResultsDirectory -File;
          $hasTests = $files.Count -gt 0;
        } else {
          Write-Host "Directory $testResultsDirectory does not exist.";
          $hasTests = $false;
        }
        Write-Host "HasTests: $hasTests";
        Write-Host "##vso[task.setvariable variable=HasTests]$hasTests";
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}

# Documentation
# - Purpose:
#   Determine whether the configured test-results directory contains files.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Coverage: Check if there are test projects`.
#   - parameter testResultsDirectory:
#     directory inspected for test result files.
#   - parameter condition:
#     Azure Pipelines condition controlling task execution.
# - Outputs:
#   - `HasTests`: `true` when the directory contains one or more files;
#     otherwise `false`.
