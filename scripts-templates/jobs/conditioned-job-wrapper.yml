parameters:
  - name: template
    type: string
  - name: parameters
    type: object
    default: {}
  - name: conditionalStage
    type: string
    default: ''
  - name: conditionalJob
    type: string
  - name: conditionalTask
    type: string
  - name: conditionalVariable
    type: string
  - name: mappingVariables
    type: object
    default: {}
  - name: additionalVariables
    type: object
    default: {}
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()

jobs:
  - template: ${{ parameters.template }}
    parameters:

      variables:
        # 1. Inject direct additional variables
        ${{ each pair in parameters.additionalVariables }}:
          ${{ pair.key }}: ${{ pair.value }}
        # 2. Dependency resolution (mappingVariables)
        ${{ if ne(parameters.conditionalStage, '') }}:
          ${{ each pair in parameters.mappingVariables }}:
            ${{ pair.key }}: $[ stageDependencies.${{ parameters.conditionalStage }}.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ coalesce(pair.value, pair.key) }}'] ]
        ${{ if eq(parameters.conditionalStage, '') }}:
          ${{ each pair in parameters.mappingVariables }}:
            ${{ pair.key }}: $[ dependencies.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ coalesce(pair.value, pair.key) }}'] ]
        # 3. Parent Summary Variable
        ${{ if and(ne(parameters.conditionalVariable, ''), ne(parameters.conditionalStage, '')) }}:
          ${{ parameters.conditionalVariable }}: $[ stageDependencies.${{ parameters.conditionalStage }}.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'] ]
        ${{ if and(ne(parameters.conditionalVariable, ''), eq(parameters.conditionalStage, '')) }}:
          ${{ parameters.conditionalVariable }}: $[ dependencies.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'] ]

      dependsOn:
        - ${{ if eq(parameters.conditionalStage, '') }}:
          - ${{ parameters.conditionalJob }}
        - ${{ each dep in parameters.dependsOn }}:
          - ${{ dep }}

      # Dynamic condition using direct dependency
      ${{ if and(ne(parameters.conditionalVariable, ''), ne(parameters.conditionalStage, '')) }}:
        condition: and(${{ parameters.condition }}, eq(stageDependencies.${{ parameters.conditionalStage }}.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'], 'true'))
      ${{ if and(ne(parameters.conditionalVariable, ''), eq(parameters.conditionalStage, '')) }}:
        condition: and(${{ parameters.condition }}, eq(dependencies.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'], 'true'))
      ${{ if eq(parameters.conditionalVariable, '') }}:
        condition: ${{ parameters.condition }}

      # =========================================================
      # Inject the real parameters
      # =========================================================
      ${{ each pair in parameters.parameters }}:
        ${{ pair.key }}: ${{ pair.value }}

# Documentation
# - Purpose:
#   Adapt an existing job template so it can be executed conditionally from
#   dependency outputs without duplicating dependency and variable wiring.
# - Inputs:
#   - parameter template:
#     job template path to invoke.
#   - parameter parameters:
#     object passed unchanged to the selected job template.
#   - parameter conditionalStage:
#     optional stage containing the dependency job. Empty means same stage.
#   - parameter conditionalJob:
#     dependency job that publishes the condition and mapped outputs.
#   - parameter conditionalTask:
#     named step that publishes the output variables.
#   - parameter conditionalVariable:
#     optional output variable used to decide whether the job runs.
#   - parameter mappingVariables:
#     mapping of local variable names to dependency output names.
#   - parameter additionalVariables:
#     variables injected directly into the target job.
#   - parameter dependsOn:
#     additional jobs the target job must depend on.
#   - parameter condition:
#     base Azure Pipelines condition applied to the target job.
# - Behavior:
#   - Adds dependency output mappings to the target job variables.
#   - Combines `condition` with `conditionalVariable` when configured.
#   - Forwards the supplied template parameters after injecting the wrapper
#     variables and condition.
# - High-level flow:
#   1. Resolve same-stage or cross-stage dependency paths.
#   2. Inject direct and mapped variables into the target job.
#   3. Add the required and additional dependencies.
#   4. Apply the generated condition and expand the target template.
