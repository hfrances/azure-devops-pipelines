parameters:
  - name: displayName
    type: string
    default: 'Apply release version to package.json'
  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: condition
    type: string
    default: succeeded()

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $packageJsonPath = 'package.json'
        $version = '$(BuildParameters.ReleaseVersion)'

        if (!(Test-Path $packageJsonPath)) {
          Write-Error "package.json not found: $packageJsonPath"
          exit 1
        }

        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Host "##vso[task.logissue type=warning]No release version calculated. Skipping package.json update."
          exit 0
        }

        $json = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
        $json.version = $version
        $json | ConvertTo-Json -Depth 100 | Set-Content $packageJsonPath
        Write-Host "Updated package.json version to: $version"
      workingDirectory: ${{ parameters.workingDirectory }}
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}

# Documentation
# - Purpose:
#   Update the `version` field in the Node package manifest with the calculated
#   release version.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Apply release version to package.json`.
#   - parameter workingDirectory:
#     component directory containing `package.json`.
#   - parameter condition:
#     Azure Pipelines condition controlling task execution.
# - Data sources:
#   `BuildParameters.ReleaseVersion` and `package.json` in `workingDirectory`.
# - Important behavior:
#   If no release version is available, the task logs a warning and leaves the
#   manifest unchanged.
