parameters:
  - name: tag
    type: string
  - name: tagPrefix
    type: string
    default: ''
  - name: includeRoot
    type: boolean
    default: true
  - name: tagSuffix
    type: string
    default: ''
  - name: buildId
    type: string
    default: ''
  - name: condition
    type: string
    default: succeeded()

steps:
  - task: PowerShell@2
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      BUILD_TAG: '${{ parameters.tag }}'
      BUILD_TAG_PREFIX: '${{ parameters.tagPrefix }}'
      BUILD_TAG_SUFFIX: '${{ parameters.tagSuffix }}'
      INCLUDE_ROOT_TAG: '${{ parameters.includeRoot }}'
      TARGET_BUILD_ID: '${{ parameters.buildId }}'
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'

        function Complete-WithError {
          param([Parameter(Mandatory = $true)][string]$Message)

          Write-Host "##vso[task.logissue type=error]$Message"
          Write-Host "##vso[task.complete result=Failed;]$Message"
          exit 0
        }

        trap {
          $message = if ($null -ne $_.Exception -and -not [string]::IsNullOrWhiteSpace($_.Exception.Message)) {
            $_.Exception.Message
          } else {
            [string]$_
          }
          Complete-WithError $message
        }

        function Resolve-TagNames {
          param(
            [Parameter(Mandatory = $true)][string]$Tag,
            [string]$Prefix,
            [string]$Suffix,
            [Parameter(Mandatory = $true)][bool]$IncludeRoot
          )

          # The suffix belongs to both the prefixed and root variants.
          $baseTag = $Tag
          if (-not [string]::IsNullOrWhiteSpace($Suffix)) {
            $baseTag = "$baseTag-$Suffix"
          }

          # An empty prefix already represents the root tag.
          if ([string]::IsNullOrWhiteSpace($Prefix)) {
            return @($baseTag)
          }

          $tagNames = @("$Prefix/$baseTag")
          if ($IncludeRoot) {
            $tagNames += $baseTag
          }
          return $tagNames
        }

        function Add-BuildTag {
          param([Parameter(Mandatory = $true)][string]$TagName)

          if ([string]::IsNullOrWhiteSpace($targetBuildId)) {
            # The logging command targets the current build.
            Write-Host "##vso[build.addbuildtag]$TagName"
          } else {
            # A buildId requires the Azure DevOps REST API and an OAuth token.
            $encodedTag = [uri]::EscapeDataString($TagName)
            $uri = "{0}{1}/_apis/build/builds/{2}/tags/{3}?api-version=7.1" -f "$(System.TeamFoundationCollectionUri)", "$(System.TeamProject)", $targetBuildId, $encodedTag
            $headers = @{
              Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
              Accept = "application/json; api-version=7.1"
            }
            Write-Host "Tag endpoint: $uri"
            Invoke-RestMethod -Method Put -Uri $uri -Headers $headers | Out-Null
          }

          # Keep the generated state variable available to later steps in this job.
          Write-Host "##vso[task.setvariable variable=BuildParameters.$TagName]true"
        }

        $targetBuildId = $env:TARGET_BUILD_ID
        if (-not [string]::IsNullOrWhiteSpace($targetBuildId) -and [string]::IsNullOrWhiteSpace($env:SYSTEM_ACCESSTOKEN)) {
          throw "System.AccessToken is not available. Enable OAuth token access for scripts to tag a specific build."
        }

        $includeRoot = [bool]::Parse($env:INCLUDE_ROOT_TAG)
        $tagNames = Resolve-TagNames `
          -Tag $env:BUILD_TAG `
          -Prefix $env:BUILD_TAG_PREFIX `
          -Suffix $env:BUILD_TAG_SUFFIX `
          -IncludeRoot $includeRoot

        foreach ($tagName in $tagNames) {
          Write-Host "Adding build tag: $tagName"
          Add-BuildTag -TagName $tagName
        }
    displayName: Mark as ${{ parameters.tag }}
    condition: ${{ parameters.condition }}

  # Documentation
  # - Purpose:
  #   Add a lifecycle tag to the current build or to the build identified by
  #   `buildId`, and expose the generated tag state as a pipeline variable.
  # - Inputs:
  #   - parameter tag:
  #     required lifecycle tag name, for example `built` or `published`.
  #   - parameter tagPrefix:
  #     optional namespace placed before the tag, for example `patata` produces
  #     `patata/published`.
  #   - parameter includeRoot:
  #     when true (default), also creates the tag without `tagPrefix` whenever a
  #     prefix is supplied. Set it to false to preserve prefix-only behavior.
  #   - parameter tagSuffix:
  #     optional suffix appended to both generated tag variants.
  #   - parameter buildId:
  #     optional Azure DevOps build identifier. When empty, the current build
  #     logging command is used; otherwise the build tags REST API is used.
  #   - parameter condition:
  #     execution condition for the step (default: `succeeded()`).
  # - Outputs:
  #   - Azure DevOps build tag(s), including the root tag when enabled.
  #   - `BuildParameters.<tag>` set to `true` for every generated tag.
  # - Behavior:
  #   - With an empty prefix, creates exactly the root tag.
  #   - With a prefix and `includeRoot: true`, creates both prefixed and root
  #     tags.
  #   - With a prefix and `includeRoot: false`, creates only the prefixed tag.
  #   - Uses `System.AccessToken` only when tagging a specific `buildId`.
  #   - Applies the same suffix to every generated tag.
  # - High-level flow:
  #   1. Validate the OAuth token when a target build is specified.
  #   2. Resolve the base, prefixed, and optional root tag names.
  #   3. Add each tag through the appropriate Azure DevOps mechanism.
  #   4. Set the corresponding `BuildParameters.<tag>` variable.
