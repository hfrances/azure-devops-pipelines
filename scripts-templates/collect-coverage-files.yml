parameters:
  - name: displayName
    type: string
    default: 'Coverage: Collect files'
  - name: condition
    type: string
    default: eq(variables.HasTests, 'true')

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $path = @("**/*.[Cc]obertura.xml", "**/[Cc]obertura.xml", "*.[Cc]obertura.xml", "[Cc]obertura.xml");
        $files = @();
        $coverageResults = "";
        Get-Item $path;
        Get-Item $path | `
          Group-Object Directory | `
          ForEach-Object {
            $files += ($_.Group | Sort-Object LastWriteTime | Select-Object -First 1)
          };
        
        Write-Host "`nCollected coverage files:"
        $files.FullName;
        $files | ForEach-Object {
          if ($coverageResults -ne "") {
            $coverageResults +=";";
          }
          $coverageResults += $_.FullName;
          Copy-Item $_ $(Agent.TempDirectory); 
        }
        Write-Host "##vso[task.setvariable variable=CoverageResults]$coverageResults"
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}

# Documentation
# - Purpose:
#   Find generated Cobertura coverage files, copy them to the agent temporary
#   directory, and expose the files for downstream coverage tasks.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Coverage: Collect files`.
#   - parameter condition:
#     Azure Pipelines condition controlling task execution.
# - Outputs:
#   - `CoverageResults`: semicolon-separated list of collected coverage paths.
#   - Matching files copied to `$(Agent.TempDirectory)`.
