parameters:
  - name: stageName
    type: string
    default: Stage
  - name: displayName
    type: string
    default: ''
  - name: conditionalStage
    type: string
    default: ''
  - name: conditionalJob
    type: string
    default: ''
  - name: conditionalTask
    type: string
    default: 'SetOutputs'
  - name: conditionalVariable
    type: string
    default: ''
  - name: mappingVariables
    type: object
    default: {}
  - name: additionalVariables
    type: object
    default: []
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: succeeded()
  - name: jobs
    type: jobList
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ coalesce(parameters.displayName, parameters.stageName) }}

    variables:
      # 1. Inject direct additional variables (supports variable entries like `- group: ...` or `- name/value`).
      - ${{ each variable in parameters.additionalVariables }}:
        - ${{ each pair in variable }}:
            ${{ pair.key }}: ${{ pair.value }}
      # 2. Dependency resolution (mappingVariables)
      - ${{ if ne(parameters.conditionalStage, '') }}:
        - ${{ each pair in parameters.mappingVariables }}:
          - name: ${{ pair.key }}
            value: $[ stageDependencies.${{ parameters.conditionalStage }}.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ coalesce(pair.value, pair.key) }}'] ]
      # 3. Parent Summary Variable
      - ${{ if and(ne(parameters.conditionalStage, ''), ne(parameters.conditionalVariable, '')) }}:
        - name: ${{ parameters.conditionalVariable }}
          value: $[ stageDependencies.${{ parameters.conditionalStage }}.${{ parameters.conditionalJob }}.outputs['${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'] ]

    dependsOn:
      - ${{ if ne(parameters.conditionalStage, '') }}:
        - ${{ parameters.conditionalStage }}
      - ${{ each dep in parameters.dependsOn }}:
        - ${{ dep }}

    # Dynamic condition using direct dependency
    ${{ if and(ne(parameters.conditionalStage, ''), ne(parameters.conditionalVariable, '')) }}:
      condition: and(${{ parameters.condition }}, eq(dependencies.${{ parameters.conditionalStage }}.outputs['${{ parameters.conditionalJob }}.${{ parameters.conditionalTask }}.${{ parameters.conditionalVariable }}'], 'true'))
    ${{ if or(eq(parameters.conditionalStage, ''), eq(parameters.conditionalVariable, '')) }}:
      condition: ${{ parameters.condition }}

    # =========================================================
    # Inject the real jobs
    # =========================================================
    jobs: ${{ parameters.jobs }}

# Documentation
# - Purpose:
#   Generate a stage that imports variables from a previous stage and applies
#   a condition based on an optional dependency output variable.
# - Inputs:
#   - parameter stageName:
#     generated stage name. Defaults to `Stage`.
#   - parameter displayName:
#     optional stage display name. When empty, `stageName` is used.
#   - parameter conditionalStage:
#     optional source stage whose outputs are consumed.
#   - parameter conditionalJob:
#     source job name inside `conditionalStage`.
#   - parameter conditionalTask:
#     source task name for output lookup. Defaults to `SetOutputs`.
#   - parameter conditionalVariable:
#     optional boolean output used to enable the generated stage.
#   - parameter mappingVariables:
#     map of local variable names to source output names.
#   - parameter additionalVariables:
#     variable entries injected into the generated stage.
#   - parameter dependsOn:
#     additional stage dependencies appended to the conditional dependency.
#   - parameter condition:
#     base Azure Pipelines condition. Defaults to `succeeded()`.
#   - parameter jobs:
#     `jobList` injected as the body of the generated stage.
# - Outputs:
#   - A stage named `stageName` with the resolved variables, dependencies,
#     condition, and supplied jobs.
# - High-level flow:
#   1. Inject direct and dependency-derived variables.
#   2. Build dependencies for the source stage and additional dependencies.
#   3. Combine `condition` with `conditionalVariable` when configured.
#   4. Inject the supplied `jobs` into the generated stage.
