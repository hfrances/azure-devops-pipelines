parameters:
  - name: displayName
    type: string
    default: 'Test .NET projects'
  - name: projects
    type: string
    default: '$(ResolvedTestProjects)'
  - name: testArguments
    type: string
    default: '--configuration Release --no-build'
  - name: condition
    type: string
    default: and(succeeded(), eq(variables['TestProjectsFound'], 'true'))

steps:
  - task: DotNetCoreCLI@2
    displayName: ${{ parameters.displayName }}
    inputs:
      command: test
      projects: '${{ parameters.projects }}'
      arguments: '${{ parameters.testArguments }}'
      publishTestResults: true
    condition: ${{ parameters.condition }}

# Documentation
# - Purpose:
#   Execute the resolved .NET test projects and publish their test results.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Test .NET projects`.
#   - parameter projects:
#     project paths or patterns passed to `dotnet test`. Defaults to
#     `$(ResolvedTestProjects)`.
#   - parameter testArguments:
#     additional arguments passed to `dotnet test`.
#   - parameter condition:
#     Azure Pipelines condition controlling task execution.
# - Outputs:
#   Published test results generated by `DotNetCoreCLI@2`.
# - High-level flow:
#   1. Run `dotnet test` with the configured project input and arguments.
#   2. Publish the generated test results.
