parameters:
  - name: displayName
    type: string
    default: 'Set output filename'
  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: condition
    type: string
    default: succeeded()

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        # Set package full name.
        $packageName = "$(MainProject.PackageName)";
        $version = "$(BuildParameters.DockerVersion)";
        if ($version) {
          $suffix = ".v$version";
        }
        else {
          $suffix = "";
        }
        Write-Host "Output filename: $packageName$suffix.tar.gz";
        Write-Host "##vso[task.setvariable variable=BuildParameters.OutputFile]$packageName$suffix.tar.gz";
        
        # Set output directory
        if ($env:BUILDPARAMETERS_OUTPUTDIRECTORY -eq '<dir>')
        {
          $outputDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY "output" (Split-Path "$env:BUILDPARAMETERS_DIRECTORY" -Leaf);
        }
        elseif ($env:BUILDPARAMETERS_OUTPUTDIRECTORY) {
          $outputDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY "output" $env:BUILDPARAMETERS_OUTPUTDIRECTORY;
        }
        else {
          $outputDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY "output";
        }
        Write-Host "##vso[task.setvariable variable=BuildParameters.OutputDirectory]$outputDirectory";
      workingDirectory: '${{ parameters.workingDirectory }}'
    displayName: ${{ parameters.displayName }}
    condition: ${{ parameters.condition }}

# Documentation
# - Purpose:
#   Calculate the package archive name and output directory used by downstream
#   packaging and artifact-publishing steps.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Set output filename`.
#   - parameter workingDirectory:
#     working directory for the PowerShell task.
#   - parameter condition:
#     Azure Pipelines condition controlling task execution.
# - Outputs:
#   - `BuildParameters.OutputFile`: package archive file name.
#   - `BuildParameters.OutputDirectory`: artifact output directory under
#     `$(Build.ArtifactStagingDirectory)`.
# - Data sources:
#   `MainProject.PackageName`, `BuildParameters.DockerVersion`,
#   `BuildParameters.OutputDirectory`, and `BuildParameters.Directory`.
