parameters:
  - name: displayName
    type: string
    default: 'Get main project properties'

steps:
  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: 'inline'
      script: |
        $taskHasIssues = $false;
        function mark-task-issue([string]$message) {
          write-warning $message;
          $script:taskHasIssues = $true;
        }

        $file = (Get-Item '$(MainProject.FullName)');

        if ($null -eq $file) {
          write-error 'Project file not found: $(MainProject.FullName)';
        }
        else {
          # Get package name
          $packageName = $file.BaseName?.ToLower();
          Write-Host "Package name: $packageName";
          Write-Host "##vso[task.setvariable variable=MainProject.PackageName]$packageName";

          $xml = [Xml] (Get-Content $file);

          # Set version
          $version = "$($xml.Project.PropertyGroup.Version)"?.Trim();
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '0.1.0';
            mark-task-issue "Version could not be obtained from project file '$($file.FullName)'. Defaulting to '$version'.";
          }
          Write-Host "Version: $version";
          Write-Host "##vso[task.setvariable variable=MainProject.Version]$version";
            
          # Set description
          $description = "$($xml.Project.PropertyGroup.Description)"?.Trim();
          Write-Host "Description: $description";
          Write-Host "##vso[task.setvariable variable=MainProject.Description]$description";
        }

        if ($taskHasIssues) {
          Write-Host "##vso[task.complete result=SucceededWithIssues;]Get main project properties completed with warnings.";
        }
    displayName: ${{ parameters.displayName }}

# Documentation
# - Purpose:
#   Read the main .NET project file and export its package name, version, and
#   description for downstream build and release tasks.
# - Inputs:
#   - parameter displayName:
#     task display name. Defaults to `Get main project properties`.
# - Outputs:
#   - `MainProject.PackageName`
#   - `MainProject.Version`
#   - `MainProject.Description`
# - Important behavior:
#   A missing version falls back to `0.1.0` and completes with warnings.
